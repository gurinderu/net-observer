name: nix-build

# Proves that the crate2nix packaging the darwin module consumes actually
# builds, which until this workflow existed had no carrier but the owner's
# own Mac (realm net-observer, node #79). Runs on macos-latest because the
# daemon links the `macos` adapter crate and the bar links AppKit:
# `Cargo.nix` is checked in, so every system's attributes evaluate purely
# from any host — no import from derivation, no network at evaluation —
# but only a darwin builder can build what the module ships.
#
# Three jobs, one per package, instead of one job building all three. A
# cold build is expensive: ~620 crate derivations at codegen-units=1 on a
# 3-core runner, plus the DuckDB C++ engine — built TWICE, because the
# daemon and the CLI resolve their features separately and so do not share
# the `libduckdb-sys` derivation (realm net-observer, node #117; the double
# build is accepted for now). cache-nix-action saves its store only when
# the job succeeds, so a single job that runs out of its budget never warms
# the cache that would have let it finish: it stays cold forever. One job
# per package keeps each build inside its own budget. Every ref can restore
# a store, but only `main` saves one and purges that job's older keys right
# after: the Actions cache is capped at 10 GB, and every pull request that
# missed its primary key was saving its own copy on its own ref, evicting
# `main`'s stores LRU — a PR's CLI job once restored the bar's store off the
# shared prefix and rebuilt DuckDB from scratch (realm net-observer, node
# #125). Cold runs observed so far: daemon ~30 min, CLI ~23, bar ~21 (the
# Reality row in AGENTS.md dates them) — 180 minutes is a ceiling, not need.
#
# The daemon job also guards the checked-in `Cargo.nix` itself: it is
# regenerated from Cargo.lock by the crate2nix CLI, and a stale copy would
# package yesterday's dependency graph without anyone noticing (realm
# net-observer, node #95).

on:
  push:
    branches: [main]
  pull_request:

# Purging old cache keys (below) calls the Actions cache-delete API, which
# needs `actions: write`; this repo's default GITHUB_TOKEN permissions are
# read-only, so it is granted explicitly here (realm net-observer, node
# #125).
permissions:
  contents: read
  actions: write

jobs:
  nix-build-daemon:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # v31 enables the flakes and nix-command experimental features by
      # default, so no extra_nix_config is needed here.
      - uses: cachix/install-nix-action@v31

      # Store cache keyed on the job and on both lockfiles: a crate2nix
      # rebuild is driven by Cargo.lock, a flake input bump by flake.lock.
      # The job name sits before the hash so that on a miss the job restores
      # its own most recent store first (a lockfile bump moves a few crates,
      # not the engine) and any sibling job's store after that — the
      # dependency crates they share are still a head start. No account or
      # secret needed — it uses the workflow's own github.token.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-daemon-${{ hashFiles('**/Cargo.lock', '**/flake.lock') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-daemon-
            nix-${{ runner.os }}-
          # Save only from `main`; purge this job's own older keys right
          # after, so exactly one daemon store survives there (#125).
          save: ${{ github.ref == 'refs/heads/main' }}
          purge: true
          purge-prefixes: nix-${{ runner.os }}-daemon-
          purge-created: 0
          purge-primary-key: never

      # Regenerate with the dev shell's crate2nix — the rev the flake pins
      # and the cargo rust-toolchain.toml pins, the same pair that produced
      # the checked-in file — so the output is byte-comparable; a floating
      # `nix run github:nix-community/crate2nix` could differ merely because
      # the generator moved. `cargo metadata` fetches the duckdb-rs fork and
      # the registry index, so this step needs network like the builds do.
      # A diff means Cargo.lock moved and nobody ran `crate2nix generate`.
      - name: Cargo.nix is fresh
        run: |
          nix develop --command crate2nix generate
          git diff --exit-code Cargo.nix crate-hashes.json

      - name: build the daemon
        run: nix build --print-build-logs .#net-observerd

  nix-build-cli:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # Same layout as the daemon job's cache, under its own key.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-cli-${{ hashFiles('**/Cargo.lock', '**/flake.lock') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-cli-
            nix-${{ runner.os }}-
          # Same policy as the daemon job's cache, above (#125).
          save: ${{ github.ref == 'refs/heads/main' }}
          purge: true
          purge-prefixes: nix-${{ runner.os }}-cli-
          purge-created: 0
          purge-primary-key: never

      - name: build the CLI
        run: nix build --print-build-logs .#net-observer-cli

  # Same reasoning as the bar step in lints.yml/tests.yml: its own job, so
  # the daemon's and the CLI's verdicts stay readable when the GUI is what
  # failed.
  nix-build-bar:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # Same layout as the daemon job's cache, under its own key.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-bar-${{ hashFiles('**/Cargo.lock', '**/flake.lock') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-bar-
            nix-${{ runner.os }}-
          # Same policy as the daemon job's cache, above (#125).
          save: ${{ github.ref == 'refs/heads/main' }}
          purge: true
          purge-prefixes: nix-${{ runner.os }}-bar-
          purge-created: 0
          purge-primary-key: never

      - name: build the menu bar
        run: nix build --print-build-logs .#net-observer-bar
