name: nix-build

# Proves that the crate2nix packaging the darwin module consumes actually
# builds, which until this job existed had no carrier but the owner's own
# Mac (realm net-observer, node #79). Runs on macos-latest because the
# daemon links the `macos` adapter crate and the bar links AppKit:
# `Cargo.nix` is checked in, so every system's attributes evaluate purely
# from any host — no import from derivation, no network at evaluation —
# but only a darwin builder can build what the module ships. The first
# step guards the checked-in file itself: it is regenerated from
# Cargo.lock by the crate2nix CLI, and a stale copy would package
# yesterday's dependency graph without anyone noticing (realm
# net-observer, node #95).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nix-build:
    runs-on: macos-latest
    # Cold: the dev shell (toolchain plus the crate2nix CLI), every crate
    # built from scratch, and the DuckDB C++ engine (bundled) all in the
    # same run.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # v31 enables the flakes and nix-command experimental features by
      # default, so no extra_nix_config is needed here.
      - uses: cachix/install-nix-action@v31

      # Store cache keyed on both lockfiles: a crate2nix rebuild is driven by
      # Cargo.lock, a flake input bump by flake.lock. No account or secret
      # needed — it uses the workflow's own github.token.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # Regenerate with the dev shell's crate2nix — the rev the flake pins
      # and the cargo rust-toolchain.toml pins, the same pair that produced
      # the checked-in file — so the output is byte-comparable; a floating
      # `nix run github:nix-community/crate2nix` could differ merely because
      # the generator moved. `cargo metadata` fetches the duckdb-rs fork and
      # the registry index, so this step needs network like the builds do.
      # A diff means Cargo.lock moved and nobody ran `crate2nix generate`.
      - name: Cargo.nix is fresh
        run: |
          nix develop --command crate2nix generate
          git diff --exit-code Cargo.nix crate-hashes.json

      - name: build the daemon and the CLI
        run: nix build --print-build-logs .#net-observerd .#net-observer-cli

      # Same reasoning as the bar step in lints.yml/tests.yml: its own step
      # so the daemon/CLI verdict above stays readable when the GUI is what
      # failed.
      - name: build the menu bar
        run: nix build --print-build-logs .#net-observer-bar
