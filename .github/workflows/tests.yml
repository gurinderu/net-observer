name: tests

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    # v1 is macOS-only; the arm64 runner matches the pinned target and lets the
    # macos crate's platform code (raw ICMP, IP_BOUND_IF, PF_ROUTE) compile.
    runs-on: macos-latest
    # The DuckDB crate builds its C++ engine from source (`bundled`), which can
    # take several minutes on a cold cache.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml and installs the pinned channel.
      - name: Install toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --all

      - name: test
        run: cargo test --all

      # The gpui menu bar is outside `default-members` because its build script
      # needs Apple's Metal shader compiler, so a plain `cargo build`/`test`
      # skips it and a break there is invisible until someone runs the GUI.
      # Kept as its own step so the daemon's verdict stays readable when the GUI
      # is the thing that failed. A macos-latest runner does carry the Metal
      # Toolchain — confirmed by this step passing on 2026-09-01; locally it
      # needs the xcrun shim in flake.nix instead.
      - name: build the menu bar
        run: cargo build -p net-observer-bar
