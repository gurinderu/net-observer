name: tests

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # `.cargo/config.toml` builds with `-C target-cpu=native`, which is right on
  # the one Mac this daemon runs on and wrong here: on the virtualised runner
  # `native` resolves to a CPU without `aes`/`sha2`, and ring's const-assert on
  # the expected aarch64-apple features then fails the whole build before a test
  # runs. An environment RUSTFLAGS REPLACES the config's, so setting it empty
  # drops the tuning and takes rustc's own aarch64-apple baseline. CI gains
  # nothing from host tuning anyway. (realm net-observer, node #45)
  RUSTFLAGS: ""

jobs:
  tests:
    # v1 is macOS-only; the arm64 runner matches the pinned target and lets the
    # macos crate's platform code (raw ICMP, IP_BOUND_IF, PF_ROUTE) compile.
    runs-on: macos-latest
    # The DuckDB crate builds its C++ engine from source (`bundled`), which can
    # take several minutes on a cold cache.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # rustup reads rust-toolchain.toml and installs the pinned channel.
      - name: Install toolchain
        run: rustup show

      # PRs restore `main`'s cache; only `main` writes, or per-PR copies
      # evict it under the 10 GB cap (#125).
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: build
        run: cargo build --all

      - name: test
        run: cargo test --all

      # The gpui menu bar is outside `default-members`, so a plain `cargo
      # build`/`test` skips it and a break there is invisible until someone
      # asks for it by name. Kept as its own step so the daemon's verdict stays
      # readable when the GUI is the thing that failed. The bar needs no Metal
      # toolchain at build time: the workspace pins gpui's `runtime_shaders`
      # feature (Cargo.toml), so the shaders compile at app launch. What its
      # build script still runs is bindgen over dispatch.h, which takes
      # libclang and the SDK headers from the runner's Command Line Tools.
      # (This step first passed on 2026-09-01, when it still needed the Metal
      # Toolchain the runner happens to carry.)
      - name: build the menu bar
        run: cargo build -p net-observer-bar
