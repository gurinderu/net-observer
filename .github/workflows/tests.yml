name: tests

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    # v1 is macOS-only; the arm64 runner matches the pinned target and lets the
    # macos crate's platform code (raw ICMP, IP_BOUND_IF, PF_ROUTE) compile.
    runs-on: macos-latest
    # The DuckDB crate builds its C++ engine from source (`bundled`), which can
    # take several minutes on a cold cache.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml and installs the pinned channel.
      - name: Install toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --all

      - name: test
        run: cargo test --all

      # The gpui menu bar is outside `default-members` because its build script
      # needs Apple's Metal shader compiler, so `cargo build`/`test` skip it and
      # a break in it is invisible until someone runs the GUI. `--all` above does
      # cover it, but only if the runner actually has the Metal Toolchain: recent
      # Xcode ships it as a separate downloadable component. Kept as its own step
      # so the daemon's verdict stays readable when this one is the thing that
      # failed, and named honestly: whether a GitHub runner carries the toolchain
      # is UNVERIFIED here — the first run of this job is what answers it.
      - name: build the menu bar (unverified on CI — see comment)
        run: cargo build -p net-observer-bar
