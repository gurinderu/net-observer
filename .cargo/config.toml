# Deliberately NO `target-cpu=native` here any more. It bought single-host
# micro-tuning at the price of an output whose contents depend on the builder's
# CPU while its store path does not say so — the moment the closure is built
# anywhere but the machine it runs on (a CI runner, a cache, another Mac), that
# is a silent illegal-instruction/feature-set trap: on a virtualised GitHub
# runner `native` already resolved to a CPU without `aes`/`sha2` and broke
# `ring`, which is why both workflows had to override RUSTFLAGS. Baseline
# aarch64-apple is fast enough for a network observer; reproducibility wins.
# (realm net-observer, node #45)
