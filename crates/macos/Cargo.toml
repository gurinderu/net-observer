[package]
name = "macos"
edition.workspace = true

[dependencies]
types.workspace = true
collector-core.workspace = true
collector-link.workspace = true
collector-proxy.workspace = true
collector-dns.workspace = true
collector-route.workspace = true
collector-host.workspace = true
surge-ping.workspace = true
socket2.workspace = true
reqwest.workspace = true
serde_json.workspace = true
libc.workspace = true
# `net` (tokio::net::TcpStream / lookup_host) is added on top of the workspace
# feature set; `time`, `process`, and the multi-thread runtime come from there.
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
