# net-observer configuration — copy to net-observer.toml and edit.
#
# Every field has a built-in default (see crates/config). This file mirrors
# those defaults; uncomment and change only what you need. Values here are
# overridden, in turn, by `NET_OBSERVER_`-prefixed environment variables, where
# nested keys use `__` as the separator, e.g.
#   NET_OBSERVER_COLLECTORS__LINK__INTERVAL="5s"

# DuckDB database file. Large blobs (pcap, `log show`) live on disk under
# `blob_dir`; only `blob_ref` metadata rows go in the DB.
db_path = "/var/lib/observer/observer.duckdb"

# Directory for captured blobs (pcap ring files, log dumps).
blob_dir = "/var/lib/observer/blobs"

# Unix-domain socket the daemon binds to serve live status. The bar (and any
# other client) connects here instead of opening the DB directly.
socket_path = "/var/lib/observer/observer.sock"

# Permission bits (octal) applied to the socket file so the unprivileged bar can
# connect while the daemon runs as root.
socket_mode = 0o666

# Optional: chown the socket to this uid (control-path hardening). Unset by
# default, so the socket keeps the daemon's ownership. It has a SECOND role: this
# uid is also authorised to send control requests (Control(..)) — it is the
# operator's explicit statement about who owns the control endpoint. To harden
# the control path, set this to the logged-in user's uid AND set
# socket_mode = 0o600 so only that owner can even connect — a world-connectable
# read socket should not also invite action attempts.
# socket_owner_uid = 501

# Optional: extra uids allowed to send control requests, on top of root, the
# daemon's own uid, socket_owner_uid above, and the logged-in console user (the
# owner of /dev/console, re-read on every request so logout and fast user
# switching take effect immediately). Empty by default. This is the escape hatch
# for a headless / SSH-only host, where /dev/console is root-owned and the
# console-user rule therefore authorises nobody. Read requests (status,
# incidents, subscribe) are never gated — only Control is.
# Env override: NET_OBSERVER_CONTROL_UIDS="[501,502]"
# control_uids = [501]

# Retention of the record's sample tables in `db_path` (realm net-observer,
# node #130). No table is pruned unless this says so: `retention_days = 0`
# (the default) keeps forever. Set it and the daemon deletes, at startup and
# then once every 24 h of awake time, every row of each table in
# `retention_tables` whose `ts_us` is older than that many days, and records
# each prune as a `record_prune` row. Only these can be named:
# connection_sample, air_sample, air_ap, wifi_sample, neighbor_sample,
# singbox_log_sample — any other name refuses to start the daemon. The other
# five sample tables (link_sample, proxy_sample, dns_sample, route_event,
# host_sample) are what the diagnoses read as "the daemon was collecting", so
# they are never prunable; air_sample and air_ap are one scan slice, so
# naming either prunes both. connection_sample is the one table pruned by
# default — one row per flow key per 15 s tick,
# measured on the owner's Mac 2026-09-17: ~3.3k rows/hour (~80k rows/day);
# the whole file grew ~1.3 MB/day before that collector and ~8 MB/day is the
# estimate with it. Widen the list here if the rest should follow.
[record]
retention_days = 0
retention_tables = ["connection_sample"]

# The `link` collector probes the local network path: default gateway
# reachability, a direct TCP connectivity check, DHCP/ARP facts and Wi-Fi SSID.
[collectors.link]
enabled = true
# Sampling interval (humantime format, e.g. "15s", "1m").
interval = "15s"
# Override the auto-detected default gateway (e.g. "10.20.0.1"). None = detect.
# gw = "10.20.0.1"
# Override the auto-detected physical interface (e.g. "en0"). None = detect.
# phys_iface = "en0"

# The `proxy` collector probes VLESS servers plus the local TUN/Clash stack.
[collectors.proxy]
enabled = true
interval = "15s"
# URL used to probe whether traffic flows through the TUN (expects HTTP 204).
tun_probe_url = "http://connectivitycheck.gstatic.com/generate_204"
# Clash/Mihomo RESTful API base URL.
clash_api = "http://127.0.0.1:9090"
# Proxy group whose `now` field names the active node. "GLOBAL" is the
# clash-core convention, but sing-box exposes ONLY the groups its config
# declares -- against such a config GLOBAL 404s and the selector column reads
# "-" forever. Point this at the TOP selector of the routing default (the one
# the operator switches): the collector follows `now` down through nested
# groups to the node that carries traffic, and reads every node under it.
selector_group = "GLOBAL"
# Each tick the collector also READS sing-box's own URL-test history for every
# node under that group (`GET /proxies/<node>`, a loopback read that emits
# nothing, so it runs under `passive` too) and lands the newest entry on the
# proxy sample as `urltest_ms` / `urltest_at_us`. sing-box writes an entry only
# for a SUCCESSFUL test and deletes it on a failed one, so a failure shows as
# the entry going absent: `urltest_absent_since_us` dates that absence. It
# never asks sing-box to test: the API's delay endpoint writes into the
# group's history and steers its selection.
# How often sing-box's URLTest group re-tests, seconds -- MUST match the
# group's `interval` in sing-box's config (its default: 3m). The
# `endpoint-dial-stall` rule calls the traffic-carrying node's test dead after
# 2 x this + 30 s of absence while raw TCP to its listener still answers.
urltest_interval_secs = 180

# The `dns` collector probes resolvers (sing-box TUN DNS, DHCP resolver, DoH) for
# the monitored service domain plus a `.ru` control domain. A fakeip answer on a
# `.ru` name is always a bug (activates the `fakeip` trigger).
[collectors.dns]
enabled = true
interval = "15s"
# The monitored service domain (the `nks[*]` probes resolve this).
monitored_domain = "nks.lab.mirari.ru"
# A `.ru` control domain (the `ru[*]` probes resolve this).
ru_control_domain = "ya.ru"
# DNS-over-HTTPS endpoint used by the `doh` resolver path.
doh_url = "https://1.1.1.1/dns-query"

# The `route` collector is Event-cadence: it holds a persistent PF_ROUTE socket
# and emits a row on every interface/address/default-route change.
[collectors.route]
enabled = true

# The `host` collector samples the 1/5/15-minute load averages — the starvation
# discriminator (high load while the TUN is dead activates the `starvation` trigger).
# The `air` collector: the radio environment -- which foreign access points
# are audible, on which channels and how loudly. OFF by default: producing the
# system wireless report costs seconds of wall time per sample, so it is
# opted into, on its own slow period (not the daemon tick).
[collectors.air]
# enabled = true
# interval = "5m"

[collectors.host]
enabled = true
interval = "15s"

# The `connections` collector: what this machine talks to -- the live flows
# sing-box carries, read from its Clash API (the `clash_api` of
# [collectors.proxy]) and folded per destination each tick. Reads a loopback
# API, sends nothing. Read back with `net-observer-cli connections --by host`.
[collectors.connections]
enabled = true
interval = "15s"

# The `singbox-log` collector: sing-box's own log, tailed each tick and its
# ERROR/WARN lines classed and counted -- the one place its dial failures and
# its "missing default interface" are written, and the only evidence of WHY the
# network died through sing-box that the passive tier can have (realm
# net-observer, node #140 for the log's format and rotation, #141 for the
# decision). Reads a world-readable local file, sends nothing; runs under both
# probing tiers. A tick with no such line writes nothing; a tick on which the
# log could not be read writes an `unreadable` row.
[collectors.singbox_log]
enabled = true
# The file launchd points sing-box's stdout/stderr at. The launchd agent
# `org.nixos.sing-box-logrotate` rotates it every 900 s once it passes 20 MB
# by `copytruncate` -- copied to `.1`, truncated in place, the same inode --
# and the reader follows that (the few lines written between the copy and the
# truncate are the agent's loss, not ours).
path = "/var/log/sing-box.log"
# Keep this equal to [collectors.link].interval (both default to 15 s): the
# `singbox-no-route` and `singbox-dial-timeout` signatures clear after two
# LINK ticks with no such line, because this reader writes nothing on a quiet
# tick and the link collector is the daemon's tick clock -- a faster link
# cadence clears them early, a slower one holds them open.
interval = "15s"

# The `pcap_ring` collector keeps a rolling in-memory capture (via tcpdump) so a
# passive incident trigger can freeze the last few MB to disk for forensics.
[collectors.pcap_ring]
enabled = true
# Ring buffer size in megabytes.
ring_mb = 8
# BPF filter — keep it cheap: link-layer control traffic only.
filter = "arp or icmp or udp port 67 or udp port 68 or ether broadcast"

# The probing tier the daemon boots into. "passive" (the default): nothing on
# the wire — the link, proxy and dns probes are withheld and land as SKIP every
# tick, the held reference streams stay closed, and only the passive collectors
# (routes, host, wifi, air, neighbours, connections, the sing-box log reader,
# pcap ring, the link's local reads) measure anything. "active": every probe
# runs. The tier is
# process-scoped: `net-observer-cli probe active|passive` or the bar's "Probe
# network" row moves it, every switch lands as a `probing_edge` row, and a
# restart returns to this value.
[probing]
default = "passive"

# Parameters of the manual actions net-observerd runs as root on an explicit
# control request (currently `launchctl kickstart -k` on the sing-box service,
# from the cli `kickstart` subcommand). This section gates nothing: config may
# switch off what the daemon does by itself, never a command the operator sends
# by hand — the invocation is the sanction. What every control request does
# need is an authorised peer (see socket_owner_uid / control_uids above), and
# acting NEVER happens automatically. A legacy `enabled` key here is ignored.
#
# Harden the socket: set socket_mode = 0o600 and socket_owner_uid above so only
# the owner can even connect to the control endpoint.
# [acting]
# launchctl service target restarted by KickstartProxy.
# singbox_service = "system/sing-box"
