[package]
name = "net-observer-bar"
edition.workspace = true

[dependencies]
types.workspace = true
config.workspace = true
# Same CLI surface as the sibling binaries (`net-observerd`, `net-observer-cli`): a
# derive parser that accepts `--config=<path>` and hard-errors on a missing
# value / unknown flag, instead of silently dropping them onto the default
# socket (which renders as an unexplained "offline").
clap.workspace = true
# `net-observer-bar` is a pure socket client: `net-observerd` owns the DuckDB store (its
# per-process file lock blocks any second opener while the daemon runs), so the
# bar never touches the DB. It fetches a live `StatusSnapshot` over the daemon's
# Unix-domain socket via `net_observer_ipc::query` and renders it; a down daemon /
# absent socket degrades to a graceful "net-observer offline" state. No DB, `store`,
# or `anyhow` dependency here — the wire types come from `net-observer-ipc`.
net-observer-ipc.workspace = true
# Local `HH:MM:SS` wall-clock formatting for event-log rows (the daemon reports
# epoch-microsecond timestamps). Same crate the daemon/types layer already uses.
jiff.workspace = true

# macOS menu-bar UI. The rich panel is drawn with gpui (Zed's GPU-accelerated
# Rust UI framework); the system status-bar item (`NSStatusItem`) plus the
# dockless activation policy are thin AppKit interop via `objc2` + `objc2-app-kit`.
# gpui's build script compiles Metal shaders and needs the macOS Metal Toolchain,
# which is why this crate is excluded from the workspace default-members (a plain
# `cargo build` skips it); build it explicitly with `cargo build -p net-observer-bar`
# on a machine that has the Metal Toolchain installed.
gpui.workspace = true
objc2.workspace = true
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSRunningApplication",
    "NSResponder",
    "NSView",
    "NSControl",
    "NSButton",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    # Anchoring the popup under the status item: `NSView::window()` +
    # `NSWindow::frame()` give the icon's on-screen rect, and `NSScreen::frame()`
    # the display bounds we convert into gpui's top-left window coordinates.
    "NSWindow",
    "NSScreen",
    # CGFloat-typed APIs: `statusItemWithLength:` + `NSVariableStatusItemLength`.
    "objc2-core-foundation",
] }

[dev-dependencies]
tempfile.workspace = true
# Headless UI tests: gpui ships a test platform (`src/platform/test/`) whose window
# implements `draw(&Scene)` as a no-op, so layout and scene construction run for
# real while rasterization does not. Enabled only here, so a normal
# `cargo build -p net-observer-bar` never pulls it in.
gpui = { workspace = true, features = ["test-support"] }
