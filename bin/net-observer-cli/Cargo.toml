[package]
name = "net-observer-cli"
edition.workspace = true

[dependencies]
# LIVE `status` / `incidents` go through the daemon's Unix-domain socket
# (`net-observer-ipc`), so `net-observerd` stays the sole DuckDB owner (its per-process
# file lock blocks any second opener). `store`/`duckdb` is kept ONLY for the
# offline `query <SQL>` forensics path, usable when the daemon is stopped.
store.workspace = true
config.workspace = true
net-observer-ipc.workspace = true
types.workspace = true
clap.workspace = true
anyhow.workspace = true
# Only the offline `diagnose` commands need a calendar: they take a moment in
# time from a human (`--at 14:05`) and must resolve it in the LOCAL zone, which
# needs the tz database. The `events` tail keeps its dependency-free UTC clock.
jiff.workspace = true
