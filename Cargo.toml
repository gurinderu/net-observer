[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/config",
    "crates/net-observer-ipc",
    "crates/store",
    "crates/collector-core",
    "crates/collector-link",
    "crates/collector-proxy",
    "crates/collector-dns",
    "crates/collector-route",
    "crates/collector-host",
    "crates/collector-wifi",
    "crates/collector-neighbors",
    "crates/triggers",
    "crates/macos",
    "crates/vuln-db",
    "crates/oui-db",
    "crates/lldp",
    "bin/net-observerd",
    "bin/net-observer-cli",
    "bin/net-observer-bar",
]
# `net-observer-bar` (gpui GUI) is intentionally excluded from the default build set:
# gpui's build script requires the macOS Metal Toolchain, which is not present on
# every dev machine / CI runner. A plain `cargo build` therefore builds the
# daemon workspace without the GUI toolchain. `net-observer-bar` remains a full
# workspace member — build it explicitly with `cargo build -p net-observer-bar` (or
# `--workspace`) on a machine that has the Metal Toolchain installed.
default-members = [
    "crates/types",
    "crates/config",
    "crates/net-observer-ipc",
    "crates/store",
    "crates/collector-core",
    "crates/collector-link",
    "crates/collector-proxy",
    "crates/collector-dns",
    "crates/collector-route",
    "crates/collector-host",
    "crates/collector-wifi",
    "crates/collector-neighbors",
    "crates/triggers",
    "crates/macos",
    "crates/vuln-db",
    "crates/oui-db",
    "crates/lldp",
    "bin/net-observerd",
    "bin/net-observer-cli",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
figment = { version = "0.10", features = ["toml", "env"] }
humantime-serde = "1"
jiff = { version = "0.2", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
duckdb = { version = "1", features = ["bundled"] }
# Pure-Rust mDNS/DNS-SD, no async runtime of its own (the adapter drives its
# blocking receiver on tokio's blocking pool). Used ONLY by the operator-pressed
# neighbour scan — nothing queries mDNS on a timer.
mdns-sd = "0.21"
clap = { version = "4", features = ["derive"] }
surge-ping = "0.8"
socket2 = "0.5"
# Async HTTP client for the macOS adapters (Clash `now`, TUN 204 probe, DoH). The
# collectors are native `async fn`, so the client is used from `reqwest`'s async
# API on the daemon's tokio runtime (never `reqwest::blocking`). Kept lean:
# `default-features = false` drops the bundled OpenSSL/`native-tls`, `rustls-tls`
# selects the pure-Rust TLS backend, and `json` adds serde_json (de)serialization
# for the DoH endpoint.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
libc = "0.2"
tempfile = "3"
gpui = "0.2.2"
objc2 = "0.6.4"
# local crates
types = { path = "crates/types" }
config = { path = "crates/config" }
net-observer-ipc = { path = "crates/net-observer-ipc" }
store = { path = "crates/store" }
collector-core = { path = "crates/collector-core" }
collector-link = { path = "crates/collector-link" }
collector-proxy = { path = "crates/collector-proxy" }
collector-dns = { path = "crates/collector-dns" }
collector-route = { path = "crates/collector-route" }
collector-host = { path = "crates/collector-host" }
collector-wifi = { path = "crates/collector-wifi" }
collector-neighbors = { path = "crates/collector-neighbors" }
triggers = { path = "crates/triggers" }
macos = { path = "crates/macos" }
vuln-db = { path = "crates/vuln-db" }
oui-db = { path = "crates/oui-db" }
lldp = { path = "crates/lldp" }

# Release tuning. This daemon is I/O-bound and idle between ~15s ticks, so the
# aim is NOT steady-state speed (there is no hot path to speed up) — it is a
# readable panic in production and a smaller, slightly-faster-to-start binary.
#   - `debug = "line-tables-only"`: a panic reads as a stack with line numbers,
#     not raw addresses. For a forensics daemon, diagnosability beats a few %.
#   - `lto = "thin"` + `codegen-units = 1`: binary size and startup, at some
#     build-time cost (already long: DuckDB compiles its C++ engine from source).
#     `fat` was rejected — it lengthens that build further for no measured gain.
#   - `panic` stays `"unwind"`. `abort` would break collector isolation: a single
#     collector panic must be logged while the others keep ticking, not abort the
#     whole daemon. (realm net-observer)
# jemalloc/PGO/BOLT deliberately NOT used: they optimise sustained CPU load this
# daemon does not have. `target-cpu=native` lives in `.cargo/config.toml`.
[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
